server {
    server_name nivaas.space www.nivaas.space;

    client_max_body_size 80m;

    location / {
        proxy_pass         http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/nivaas.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nivaas.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name nivaas.space www.nivaas.space;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name nivass.digiinksolutions.com;
    return 301 https://nivaas.space$request_uri;
}

server {
    listen 443 ssl;
    server_name nivass.digiinksolutions.com;

    ssl_certificate /etc/letsencrypt/live/nivass.digiinksolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nivass.digiinksolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nivaas.space$request_uri;
}
