# /etc/nginx/sites-available/nivaas   (then: ln -s ../sites-available/nivaas /etc/nginx/sites-enabled/)
# Replace nivaas.yourdomain.com, then run: certbot --nginx -d nivaas.yourdomain.com
server {
    listen 80;
    server_name nivaas.yourdomain.com;

    client_max_body_size 80m;          # project videos / brochures

    location / {
        proxy_pass         http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
